# Blueprint de Render. Tiene que vivir en la raíz del repo, aunque el servicio
# sea solo el backend.
#
# La base NO se declara acá: Postgres va en Neon (free, no vence) y se conecta
# por las variables SPRING_DATASOURCE_*. Render también ofrece Postgres, pero su
# instancia gratuita expira; Neon evita tener que migrar en unos meses.
services:
  - type: web
    name: monitor-inflacion-api
    runtime: docker
    plan: free
    region: oregon

    # OJO con las tres rutas de abajo. La documentación del blueprint dice que
    # dockerfilePath y dockerContext se resuelven desde la raíz del repo, pero
    # en los hechos se resuelven desde rootDir: con "./backend/Dockerfile" el
    # build falla con
    #   lstat /opt/render/project/src/backend/backend: no such file or directory
    # o sea, backend/ aplicado dos veces. Por eso van relativas a backend/.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .

    healthCheckPath: /actuator/health

    # sync: false => Render los pide a mano al crear el blueprint y nunca
    # quedan escritos en el repo. El token del INDEC no se versiona.
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: INDEC_API_TOKEN
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
