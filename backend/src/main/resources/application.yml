spring:
  application:
    name: monitor-inflacion
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:monitor_inflacion}
    username: ${DB_USER:monitor_inflacion}
    password: ${DB_PASSWORD:monitor_inflacion}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Las PaaS (Railway, Render, Fly) inyectan PORT y esperan que la app escuche ahí.
  # SERVER_PORT queda como alias para no romper a quien ya lo usaba localmente.
  port: ${PORT:${SERVER_PORT:8080}}

indec:
  api:
    base-url: ${INDEC_API_BASE_URL:https://api.indec.gob.ar/v1}
    token: ${INDEC_API_TOKEN:}
    nivel-general-descripcion: ${INDEC_NIVEL_GENERAL_DESCRIPCION:Nivel general}
    # La API-INDEC devuelve este literal SIN tilde ("Indice"); con tilde el filtro
    # PostgREST no matchea nada y la sincronización trae 0 puntos.
    tipo-indicador-indice: ${INDEC_TIPO_INDICADOR_INDICE:Indice}
    # Literal del campo "nivel" que identifica las aperturas por división COICOP
    # (las 12 categorías: alimentos, vivienda, salud, transporte, …). Este SÍ con tilde.
    nivel-division: ${INDEC_NIVEL_DIVISION:División}
    region-nacional: ${INDEC_REGION_NACIONAL:Nacional}
  sync:
    # Cron de sincronización automática. Por defecto: todos los días a las 9:00.
    # La API-INDEC publica el IPC una vez al mes, así que esto solo "hace algo" ese día,
    # pero sincronizar de más es gratis e idempotente.
    cron: ${INDEC_SYNC_CRON:0 0 9 * * *}
    habilitado: ${INDEC_SYNC_HABILITADO:true}
    # Sincroniza al arrancar SOLO si la base está vacía. Sin esto, un despliegue
    # nuevo queda mostrando "no hay datos" hasta el próximo cron o hasta que
    # alguien apriete el botón.
    al-iniciar: ${INDEC_SYNC_AL_INICIAR:true}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    ar.com.facundoluna.inflacion: INFO
