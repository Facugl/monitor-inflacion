services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitor_inflacion
      POSTGRES_USER: monitor_inflacion
      POSTGRES_PASSWORD: monitor_inflacion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor_inflacion"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: monitor_inflacion
      DB_USER: monitor_inflacion
      DB_PASSWORD: monitor_inflacion
      INDEC_API_TOKEN: ${INDEC_API_TOKEN:?Falta INDEC_API_TOKEN. Generalo en https://api.indec.gob.ar/docs y poné el valor en un archivo .env}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8081
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  postgres_data:
